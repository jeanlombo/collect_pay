<VirtualHost *:8080>
    ServerAdmin webmaster@localhost

    ServerName https://collectpay-production.up.railway.app:443

    DocumentRoot /var/www/html/collect_pay

    UseCanonicalName On
    UseCanonicalPhysicalPort Off

    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    SetEnvIf X-Forwarded-Proto "^https$" SERVER_PORT=443

    <Directory /var/www/html/collect_pay>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Corriger les redirections Apache contenant le port interne Railway
    Header always edit Location "^https://([^/:]+):8080/(.*)$" "https://$1/$2"
    Header always edit Location "^http://([^/:]+):8080/(.*)$" "https://$1/$2"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>