<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html/collect_pay

    # Compatibilité avec les nombreux liens historiques /collect_pay/...
    Alias /collect_pay /var/www/html/collect_pay

    <Directory /var/www/html/collect_pay>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    <Directory /var/www/html/collect_pay/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
